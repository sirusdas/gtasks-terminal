name: Build Android APK

on:
  push:
    branches:
      - feature/spaces-and-subspaces
      - feature/flutter-app
      - feature/app-microsoft-todo
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: gtasks_app
        run: flutter pub get

      - name: Build Debug APK
        working-directory: gtasks_app
        run: |
          set +e
          flutter build apk --debug --verbose > ../build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            grep -E -C 3 "e: |FAILURE:|ERROR:|Exception:|error: " ../build.log | tail -n 150 > ../error_summary.txt
            if [ ! -s ../error_summary.txt ]; then
              tail -n 150 ../build.log > ../error_summary.txt
            fi
            cat ../error_summary.txt
            exit $BUILD_EXIT
          fi

      - name: Report Build Error on Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-build
          name: "GTasks App Build Error"
          body_path: error_summary.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtasks-app-debug
          path: gtasks_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish Nightly Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/spaces-and-subspaces' || github.ref == 'refs/heads/feature/app-microsoft-todo'
        with:
          tag_name: nightly-build
          name: "GTasks App Nightly Build"
          body: "Automated debug APK build from latest commit."
          prerelease: true
          files: gtasks_app/build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
